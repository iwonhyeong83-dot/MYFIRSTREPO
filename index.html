<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="인공지능기본법 시행령 본칙 33개 조와 부칙 6개 조를 검색·열람하는 직원용 페이지" />
    <title>AI 기본법 시행령 조문 검색</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip-link" href="#results">검색 결과로 건너뛰기</a>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand" aria-label="행정안전부 디지털정부실">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span>행정안전부 디지털정부실</span>
        </div>
        <p class="eyebrow">대통령령 제36053호 · 시행 2026. 1. 22.</p>
        <h1>인공지능기본법 시행령<br /><strong>조문 검색·열람</strong></h1>
        <p class="intro">본칙 33개 조와 부칙 6개 조를 키워드로 빠르게 찾아보세요.</p>
      </div>
    </header>

    <main>
      <section class="search-panel" aria-labelledby="search-title">
        <h2 id="search-title" class="sr-only">조문 검색</h2>
        <label for="searchInput">본문 키워드 검색</label>
        <div class="search-row">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="예: 고영향 인공지능, 기본계획, 학습용데이터" autocomplete="off" />
          <button id="clearButton" type="button" hidden>지우기</button>
        </div>
        <div class="result-toolbar">
          <p id="resultCount" role="status" aria-live="polite">결과 0건</p>
          <p id="searchHint">검색어가 없으면 전체 조문을 표시합니다.</p>
        </div>
      </section>

      <section id="results" class="card-grid" aria-label="조문 검색 결과" aria-busy="true"></section>
      <div id="emptyState" class="empty-state" hidden>
        <strong>검색 결과가 없습니다.</strong>
        <p>다른 키워드로 다시 검색해 주세요.</p>
      </div>
      <div id="errorState" class="error-state" hidden>
        <strong>조항 데이터를 불러오지 못했습니다.</strong>
        <p>파일 경로와 배포 상태를 확인해 주세요.</p>
      </div>
    </main>

    <footer>
      <p>본 페이지는 업무 편의를 위한 검색 도구입니다. 정확한 법령 내용은 국가법령정보센터 원문을 확인하세요.</p>
    </footer>
    <script src="./app.js" defer></script>
  </body>
</html>
